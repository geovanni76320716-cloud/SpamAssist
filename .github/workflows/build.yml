
name: Build Spam Assist

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android ARM64
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: SpamAssist
          path: build/**/*.geode
    
