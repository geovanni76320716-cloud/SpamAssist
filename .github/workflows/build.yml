name: Build Geode Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: Android
          target: Android64
          sdk: 5.11.2
          build: true