name: Build Geode Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64 Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: 5.11.2
          cli: latest
          build-config: Release
          path: ./
          combine: false
          android-min-sdk: 23
          use-lto: true