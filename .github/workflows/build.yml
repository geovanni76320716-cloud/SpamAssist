name: Build Spam Assist

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Android ARM64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: SpamAssist
          path: ${{ steps.build.outputs.build-output }}/*.geode
        
